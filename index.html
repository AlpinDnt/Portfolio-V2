<!doctype html>
<html lang="en" data-theme="light" class="preload">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23141210'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial Black' font-size='16' font-weight='900' fill='%23fffcfa'%3EA%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffcfa" />
    <meta
      name="description"
      content="AlpinDnt — Junior Web Developer from Bali building fast, clean React interfaces and e-commerce UI."
    />
    <title>AlpinDnt | Web Developer — Bali</title>
    <script>
      /*
       * Theme bootstrap — runs before first paint so the saved theme is
       * applied immediately. Without this, index.html's default light
       * theme paints first, then React flips it in a useEffect, and the
       * body color transition shows a light→dark blend flash.
       */
      (function () {
        try {
          var stored = localStorage.getItem("alpindnt-theme");
          var theme = stored === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#0d0b09" : "#fffcfa");
          }
        } catch (e) {
          /* localStorage unavailable — keep the default theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
